# Publica o back end do Delfos na Cloudflare.
#
# Roda sozinho quando algo em backend/ muda no branch principal, e também
# pelo botão "Run workflow" na aba Actions do GitHub.
#
# Precisa de dois segredos do repositório (Settings → Secrets and variables →
# Actions) — passo a passo em backend/README.md:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# E aceita um terceiro, opcional: CODIGO_CONVITE (criar conta passa a exigir
# esse código).

name: Back end

on:
  push:
    branches: [main, claude/agente-organizacao-pessoal-xqow0u]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  publicar:
    needs: testes
    # Pull request só testa; publicar é só do branch principal ou do botão.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Conferir os segredos
        run: |
          falta=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || falta="$falta CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || falta="$falta CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$falta" ]; then
            echo "::error::Faltam segredos do repositório:$falta. Veja backend/README.md."
            exit 1
          fi

      - run: npm ci

      # Cria o banco na primeira vez e escreve o id dele em wrangler.toml (só
      # nesta execução — o arquivo do repositório não muda).
      - name: Banco de dados (D1)
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "delfos") | .uuid')
          if [ -z "$id" ]; then
            npx wrangler d1 create delfos
            id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "delfos") | .uuid')
          fi
          [ -n "$id" ] || { echo "::error::Não consegui criar nem achar o banco 'delfos'."; exit 1; }
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
          npx wrangler d1 migrations apply delfos --remote

      - name: Publicar o Worker
        run: npx wrangler deploy

      # Com CODIGO_CONVITE, só cria conta quem tiver o código. Sem ele, o
      # cadastro fica aberto — e o código antigo, se havia, é removido.
      - name: Código de convite
        env:
          CODIGO_CONVITE: ${{ secrets.CODIGO_CONVITE }}
        run: |
          if [ -n "$CODIGO_CONVITE" ]; then
            printf '%s' "$CODIGO_CONVITE" | npx wrangler secret put CODIGO_CONVITE
          else
            npx wrangler secret delete CODIGO_CONVITE < /dev/null 2>/dev/null || true
          fi

      - name: Endereço publicado
        run: |
          echo "Servidor no ar. O endereço (https://delfos-api.<subdomínio>.workers.dev) aparece"
          echo "no fim do passo 'Publicar o Worker' acima — é ele que vai em dashboard/sessao.js (API_PUBLICA)."
