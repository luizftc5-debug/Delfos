# Publica o back end do Delfos na Cloudflare.
#
# Roda sozinho quando algo em backend/ muda no branch principal, e também
# pelo botão "Run workflow" na aba Actions do GitHub.
#
# Precisa de três segredos do repositório (Settings → Secrets and variables →
# Actions) — passo a passo em backend/README.md:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SENHA_DELFOS

name: Back end

on:
  push:
    branches: [main, claude/agente-organizacao-pessoal-xqow0u]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  publicar:
    needs: testes
    # Pull request só testa; publicar é só do branch principal ou do botão.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Conferir os segredos
        env:
          SENHA_DELFOS: ${{ secrets.SENHA_DELFOS }}
        run: |
          falta=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || falta="$falta CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || falta="$falta CLOUDFLARE_ACCOUNT_ID"
          [ -n "$SENHA_DELFOS" ] || falta="$falta SENHA_DELFOS"
          if [ -n "$falta" ]; then
            echo "::error::Faltam segredos do repositório:$falta. Veja backend/README.md."
            exit 1
          fi
          if [ ${#SENHA_DELFOS} -lt 8 ]; then
            echo "::error::SENHA_DELFOS precisa ter pelo menos 8 caracteres."
            exit 1
          fi

      - run: npm ci

      # Cria o banco na primeira vez e escreve o id dele em wrangler.toml (só
      # nesta execução — o arquivo do repositório não muda).
      - name: Banco de dados (D1)
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "delfos") | .uuid')
          if [ -z "$id" ]; then
            npx wrangler d1 create delfos
            id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "delfos") | .uuid')
          fi
          [ -n "$id" ] || { echo "::error::Não consegui criar nem achar o banco 'delfos'."; exit 1; }
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
          npx wrangler d1 migrations apply delfos --remote

      - name: Publicar o Worker
        run: npx wrangler deploy

      - name: Gravar a senha
        env:
          SENHA_DELFOS: ${{ secrets.SENHA_DELFOS }}
        run: printf '%s' "$SENHA_DELFOS" | npx wrangler secret put SENHA
