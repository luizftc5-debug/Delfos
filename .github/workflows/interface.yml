name: Interface

on:
  push:
    paths: ["dashboard/**", "index.html", ".github/workflows/interface.yml"]
  pull_request:
    paths: ["dashboard/**", "index.html", ".github/workflows/interface.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar sintaxe
        run: |
          for arquivo in dashboard/*.js dashboard/*.mjs; do
            node --check "$arquivo" || exit 1
          done
      - name: Verificar persistência e backup
        run: node --test dashboard/test/*.test.cjs

  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar ferramenta de teste
        run: |
          python -m pip install -r dashboard/test/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verificar salvamento automático e editor
        run: python dashboard/test/editor.browser.py
      - name: Verificar organização das páginas e criação de abas
        run: python dashboard/test/organizacao.browser.py
      - name: Verificar configurações e criação com IA local
        run: python dashboard/test/configuracoes_ia.browser.py
      - name: Verificar fontes, documentos da faculdade e agenda
        run: python dashboard/test/faculdade_documentos.browser.py
      - name: Verificar os modelos de abas
        run: python dashboard/test/modelos_abas.browser.py
      - name: Verificar rotina, importação de arquivo e formas de ver
        run: python dashboard/test/agenda_rotina.browser.py
      - name: Verificar Alimentação, planilhas do Excel e reordenar arrastando
        run: python dashboard/test/alimentacao_planilhas.browser.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar alimentos de rotina e os acompanhamentos dos modelos
        run: |
          npm install --prefix "$RUNNER_TEMP/delfos-browser" playwright
          export DELFOS_PLAYWRIGHT="$RUNNER_TEMP/delfos-browser/node_modules/playwright"
          export DELFOS_BROWSER_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          node dashboard/test/experiencia.browser.cjs
          node dashboard/test/editor-experiencia.browser.cjs
          node dashboard/test/editor-exportar.browser.cjs
          node dashboard/test/portal-sidebar.browser.cjs
