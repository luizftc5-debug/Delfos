<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Disciplina · Delfos</title>
  <meta name="theme-color" content="#111110" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <script src="config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Sans:ital,wght@0,300..800;1,300..800&family=Noto+Serif+Display:wght@300..600&display=swap" />
  <!-- Mesmas fontes do editor de resumos: a pré-visualização aqui usa a fonte
       que a pessoa escolheu lá, então precisa carregá-las também. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;600&family=Space+Mono:wght@400;700&family=Caveat:wght@500;700&display=swap" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <div class="app">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main">
      <div class="wrap" id="conteudo">
        <a class="voltar" href="faculdade.html">← Faculdade</a>

        <header class="topbar">
          <div>
            <div class="eyebrow faculdade" id="etiqueta">Disciplina</div>
            <h1 id="titulo">&nbsp;</h1>
            <p class="sub" id="subtitulo"></p>
          </div>
          <div class="topbar-actions">
            <button class="btn" id="btn-editar">Editar disciplina</button>
            <button class="btn primary" id="btn-avaliacao">+ Avaliação</button>
          </div>
        </header>

        <div class="grid g4" style="margin-bottom:14px;">
          <div class="card tinted faculdade">
            <div class="stat-label">Média até agora</div>
            <div class="stat-value num" id="s-media">-</div>
            <div class="stat-sub" id="s-media-d"></div>
          </div>
          <div class="card tinted faculdade">
            <div class="stat-label">Próxima avaliação</div>
            <div class="stat-value" id="s-proxima" style="font-size:17px;">-</div>
            <div class="stat-sub" id="s-proxima-d"></div>
          </div>
          <div class="card tinted faculdade">
            <div class="stat-label">Prazos em aberto</div>
            <div class="stat-value num" id="s-prazos">-</div>
            <div class="stat-sub" id="s-prazos-d"></div>
          </div>
          <div class="card tinted faculdade">
            <div class="stat-label">Materiais e resumos</div>
            <div class="stat-value num" id="s-conteudo">-</div>
            <div class="stat-sub" id="s-conteudo-d"></div>
          </div>
        </div>

        <div class="gaveteiro">
          <section class="gaveta" data-gaveta="avaliacoes" data-icone="alvo">
            <header class="gaveta-cab">
              <h2 class="gaveta-titulo">Avaliações e notas</h2>
              <span class="gaveta-resumo" id="avaliacoes-resumo"></span>
            </header>
            <div class="gaveta-corpo"><div id="avaliacoes"></div></div>
          </section>

          <section class="gaveta" data-gaveta="prazos" data-icone="relogio">
            <header class="gaveta-cab">
              <h2 class="gaveta-titulo">Prazos e entregas</h2>
              <span class="gaveta-resumo" id="prazos-resumo"></span>
              <div class="gaveta-acoes"><button class="btn sm" id="btn-prazo" type="button">+ Prazo</button></div>
            </header>
            <div class="gaveta-corpo"><div id="prazos"></div></div>
          </section>

          <section class="gaveta" data-gaveta="resumos" data-icone="lapis">
            <header class="gaveta-cab">
              <h2 class="gaveta-titulo">Resumos e anotações</h2>
              <span class="gaveta-resumo" id="resumos-resumo"></span>
              <div class="gaveta-acoes"><button class="btn sm" id="btn-resumo" type="button">+ Resumo</button></div>
            </header>
            <div class="gaveta-corpo"><div id="resumos"></div></div>
          </section>

          <section class="gaveta" data-gaveta="materiais" data-icone="arquivo">
            <header class="gaveta-cab">
              <h2 class="gaveta-titulo">Materiais</h2>
              <span class="gaveta-resumo" id="materiais-resumo"></span>
              <div class="gaveta-acoes">
                <button class="btn ghost sm" id="btn-drive" type="button">⇩ Importar do Drive</button>
                <button class="btn sm" id="btn-material" type="button">+ Material</button>
              </div>
            </header>
            <div class="gaveta-corpo"><div id="materiais"></div></div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="arquivos.js"></script>
  <script src="store.js"></script>
  <script src="personalizacao.js"></script>
  <script src="ui.js"></script>
  <script src="sessao.js"></script>
  <script src="nuvem.js"></script>
  <script src="financas.js"></script>
  <script src="leituras.js"></script>
  <script src="google-integration.js"></script>
  <script src="disciplina.js"></script>
</body>
</html>
