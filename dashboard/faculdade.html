<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Faculdade · Delfos</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="theme.css" />
  <script src="config.js"></script>
</head>
<body>
  <div class="app">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main">
      <div class="wrap">
        <header class="topbar">
          <div>
            <div class="eyebrow faculdade">Disciplinas e prazos</div>
            <h1>Faculdade</h1>
            <p class="sub">Medicina · disciplinas, provas, entregas e TCC.</p>
          </div>
          <div class="topbar-actions">
            <button class="btn" id="btn-disciplina">+ Disciplina</button>
            <button class="btn primary" id="btn-prazo">+ Prazo</button>
          </div>
        </header>

        <div id="avisos"></div>

        <div class="grid g3" style="margin-bottom:14px;">
          <div class="card tinted faculdade">
            <div class="stat-label">Disciplinas ativas</div>
            <div class="stat-value num" id="s-disciplinas">—</div>
            <div class="stat-sub" id="s-disciplinas-d"></div>
          </div>
          <div class="card tinted faculdade">
            <div class="stat-label">Prazos em aberto</div>
            <div class="stat-value num" id="s-prazos">—</div>
            <div class="stat-sub" id="s-prazos-d"></div>
          </div>
          <div class="card tinted faculdade">
            <div class="stat-label">Próxima avaliação</div>
            <div class="stat-value" id="s-proxima" style="font-size:19px;">—</div>
            <div class="stat-sub" id="s-proxima-d"></div>
          </div>
        </div>

        <div class="grid g2">
          <section class="card">
            <div class="card-head">
              <h2 class="card-title"><span class="swatch faculdade"></span>Disciplinas</h2>
              <button class="btn ghost sm" id="btn-disciplina-2">+ Adicionar</button>
            </div>
            <div id="disciplinas"></div>
          </section>

          <section class="card">
            <div class="card-head">
              <h2 class="card-title">Prazos e entregas</h2>
              <label class="card-note" style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                <input type="checkbox" class="check" id="ver-concluidos" /> ver concluídos
              </label>
            </div>
            <div id="prazos"></div>
          </section>
        </div>

        <section class="section">
          <div class="section-head">
            <h2 class="section-title">Google Calendar</h2>
            <span class="google-state" id="google-status"><span class="google-dot"></span><span id="google-texto">Não conectado</span></span>
          </div>
          <div class="card">
            <p class="card-note" style="margin:0 0 12px;">Conecte para ver os próximos eventos da sua agenda ao lado dos prazos cadastrados aqui.</p>
            <button class="btn" id="google-connect-btn">Conectar ao Google</button>
            <div id="google-calendar-list" style="margin-top:12px;"></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="arquivos.js"></script>
  <script src="store.js"></script>
  <script src="ui.js"></script>
  <script src="https://apis.google.com/js/api.js" onload="onGapiLoad()"></script>
  <script src="https://accounts.google.com/gsi/client" onload="onGisLoad()"></script>
  <script src="google-integration.js"></script>
  <script src="faculdade.js"></script>
</body>
</html>
