<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visão geral · Delfos</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Sans:ital,wght@0,300..800;1,300..800&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&display=swap" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <div class="app">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main">
      <div class="wrap">
        <header class="topbar">
          <div>
            <div class="eyebrow data" id="sub-hoje"></div>
            <h1 id="saudacao">Visão geral</h1>
            <p class="sub" id="sub-resumo"></p>
          </div>
          <div class="topbar-actions">
            <button class="btn" id="btn-lancamento">+ Lançamento</button>
            <button class="btn primary" id="btn-prazo">+ Prazo</button>
          </div>
        </header>

        <!-- A leitura: o painel diz em uma frase o que está acontecendo.
             É o único texto em serifa da tela. -->
        <p class="leitura" id="leitura"></p>

        <div id="avisos"></div>

        <div class="grid g2" style="margin-bottom:14px;">
          <section class="card hero">
            <div class="stat-label">Saldo atual</div>
            <div class="hero-value num" id="hero-saldo">—</div>
            <div class="stat-sub" id="hero-detalhe"></div>
            <button class="btn sm" id="btn-saldo" style="margin-top:14px;">Ajustar saldo</button>
          </section>

          <section class="card">
            <div class="card-head">
              <h2 class="card-title">Próximo compromisso</h2>
            </div>
            <div id="proximo"></div>
          </section>
        </div>

        <!-- Os pilares se encostam num campo contíguo, separados por 1px. -->
        <div class="grid campo pilares" id="pilares"></div>

        <section class="section" id="sec-notas">
          <div class="section-head">
            <h2 class="section-title">O que o Delfos notou</h2>
            <span class="card-note">o que pede ação, de todas as abas</span>
          </div>
          <div class="card"><ul class="notas" id="notas"></ul></div>
        </section>

        <section class="section">
          <div class="section-head">
            <h2 class="section-title">Próximos 30 dias</h2>
            <span class="card-note" id="agenda-resumo"></span>
          </div>
          <div class="card"><div id="agenda"></div></div>
        </section>

        <section class="section">
          <div class="section-head">
            <h2 class="section-title">Leitura da situação</h2>
          </div>
          <div class="grid g-auto" id="insights"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="arquivos.js"></script>
  <script src="store.js"></script>
  <script src="personalizacao.js"></script>
  <script src="ui.js"></script>
  <script src="sessao.js"></script>
  <script src="nuvem.js"></script>
  <script src="financas.js"></script>
  <script src="lancamento.js"></script>
  <script src="leituras.js"></script>
  <script src="abas.js"></script>
  <script src="home.js"></script>
</body>
</html>
