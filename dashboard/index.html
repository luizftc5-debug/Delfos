<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Visão geral · Delfos</title>
  <meta name="theme-color" content="#111110" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Sans:ital,wght@0,300..800;1,300..800&family=Noto+Serif+Display:wght@300..600&display=swap" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <div class="app">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main">
      <div class="wrap">
        <header class="topbar">
          <div>
            <h1>Visão geral</h1>
            <p class="sub" id="sub-hoje"></p>
          </div>
          <div class="topbar-actions">
            <button class="btn primary" id="btn-registrar" type="button">+ Registrar</button>
          </div>
        </header>

        <!-- A leitura é o título da página: a saudação abre a frase, em tom
             mais baixo, e o painel diz o que está acontecendo. -->
        <p class="leitura" id="leitura"></p>

        <!-- O gaveteiro: cada gaveta diz o essencial no puxador e guarda o
             resto dentro (UI.gavetas liga o abrir e fechar). -->
        <div class="gaveteiro">
          <section class="gaveta" id="sec-agenda" data-gaveta="agenda" data-icone="calendario">
            <header class="gaveta-cab">
              <h2 class="gaveta-titulo">Agenda</h2>
              <span class="gaveta-resumo" id="agenda-resumo"></span>
              <div class="gaveta-acoes"><button class="btn sm" id="btn-agenda-novo" type="button">+ Compromisso</button></div>
            </header>
            <div class="gaveta-corpo">
              <div id="agenda"></div>
            </div>
          </section>

          <section class="gaveta" id="sec-topo" data-gaveta="dinheiro" data-icone="financeiro" style="--cor-pagina: var(--s-financeiro)">
            <header class="gaveta-cab">
              <h2 class="gaveta-titulo">Dinheiro</h2>
              <span class="gaveta-resumo" id="dinheiro-resumo"></span>
              <div class="gaveta-acoes"><button class="btn sm" id="btn-lancamento" type="button">+ Lançamento</button></div>
            </header>
            <div class="gaveta-corpo">
              <div class="trio" aria-label="Números do dinheiro">
                <div class="trio-item">
                  <div class="stat-label" id="hero-rotulo">Saldo nas contas</div>
                  <div class="stat-value num" id="hero-saldo">-</div>
                  <div class="stat-sub" id="hero-detalhe"></div>
                  <button class="btn sm" id="btn-saldo" type="button">Ajustar saldo</button>
                </div>
                <div class="trio-item">
                  <div class="stat-label" id="mes-rotulo">No mês</div>
                  <div class="stat-value num" id="mes-valor">-</div>
                  <div class="stat-sub" id="mes-detalhe"></div>
                </div>
                <div class="trio-item">
                  <div class="stat-label">A pagar</div>
                  <div class="stat-value num" id="pagar-valor">-</div>
                  <div class="stat-sub" id="pagar-detalhe"></div>
                </div>
              </div>
              <dl class="figuras" id="sec-insights"></dl>
              <a class="link-gaveta" href="financeiro.html">Abrir o Financeiro</a>
            </div>
          </section>

          <section class="gaveta" id="sec-notas" data-gaveta="notas" data-icone="lampada">
            <header class="gaveta-cab">
              <h2 class="gaveta-titulo">O que o Delfos notou</h2>
              <span class="gaveta-resumo" id="notas-resumo"></span>
            </header>
            <div class="gaveta-corpo">
              <ul class="notas" id="notas"></ul>
              <button class="link-gaveta" id="notas-mais" type="button" hidden></button>
            </div>
          </section>

          <section class="gaveta" id="sec-abas" data-gaveta="abas" data-icone="grade">
            <header class="gaveta-cab">
              <h2 class="gaveta-titulo">Suas abas</h2>
              <span class="gaveta-resumo" id="abas-resumo"></span>
              <div class="gaveta-acoes"><button class="btn sm" id="btn-nova-aba-home" type="button">+ Nova aba</button></div>
            </header>
            <div class="gaveta-corpo">
              <nav class="estante" id="pilares" aria-label="Suas abas"></nav>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="arquivos.js"></script>
  <script src="store.js"></script>
  <script src="personalizacao.js"></script>
  <script src="ui.js"></script>
  <script src="sessao.js"></script>
  <script src="nuvem.js"></script>
  <script src="financas.js"></script>
  <script src="lancamento.js"></script>
  <script src="leituras.js"></script>
  <script src="home.js"></script>
</body>
</html>
