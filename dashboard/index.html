<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Visão geral · Delfos</title>
  <meta name="theme-color" content="#121413" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&family=Funnel+Sans:ital,wght@0,300..800;1,300..800&display=swap" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <div class="app">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main">
      <div class="wrap">
        <header class="topbar">
          <div>
            <h1>Visão geral</h1>
            <p class="sub" id="sub-hoje"></p>
          </div>
          <div class="topbar-actions">
            <button class="btn" id="btn-lancamento">+ Lançamento</button>
            <button class="btn primary" id="btn-prazo">+ Prazo</button>
          </div>
        </header>

        <!-- A leitura é o título da página: a saudação abre a frase, em tom
             mais baixo, e o painel diz o que está acontecendo. -->
        <p class="leitura" id="leitura"></p>

        <!-- Razão: os quatro números do dia em colunas abertas, sem caixa. -->
        <section class="razao" id="sec-topo" aria-label="Números de hoje">
          <div class="razao-item principal">
            <div class="stat-label" id="hero-rotulo">Saldo nas contas</div>
            <div class="hero-value num" id="hero-saldo">-</div>
            <div class="stat-sub" id="hero-detalhe"></div>
            <button class="btn sm" id="btn-saldo">Ajustar saldo</button>
          </div>
          <div class="razao-item">
            <div class="stat-label" id="mes-rotulo">No mês</div>
            <div class="stat-value num" id="mes-valor">-</div>
            <div class="stat-sub" id="mes-detalhe"></div>
          </div>
          <div class="razao-item" id="proximo"></div>
          <div class="razao-item">
            <div class="stat-label">A pagar</div>
            <div class="stat-value num" id="pagar-valor">-</div>
            <div class="stat-sub" id="pagar-detalhe"></div>
          </div>
        </section>

        <div class="home-duas">
          <section class="home-agenda" id="sec-agenda">
            <div class="section-head">
              <h2 class="section-title">Agenda</h2>
              <span class="card-note" id="agenda-resumo"></span>
            </div>
            <div id="agenda"></div>
          </section>

          <div class="home-lado">
            <section id="sec-notas">
              <div class="section-head">
                <h2 class="section-title">O que o Delfos notou</h2>
              </div>
              <ul class="notas" id="notas"></ul>
            </section>

            <section id="sec-insights">
              <div class="section-head">
                <h2 class="section-title">Em números</h2>
              </div>
              <dl class="figuras" id="insights"></dl>
            </section>
          </div>
        </div>

        <section class="section" id="sec-abas">
          <div class="section-head">
            <h2 class="section-title">Suas abas</h2>
          </div>
          <nav class="indice" id="pilares" aria-label="Suas abas"></nav>
        </section>
      </div>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="arquivos.js"></script>
  <script src="store.js"></script>
  <script src="personalizacao.js"></script>
  <script src="ui.js"></script>
  <script src="sessao.js"></script>
  <script src="nuvem.js"></script>
  <script src="financas.js"></script>
  <script src="lancamento.js"></script>
  <script src="leituras.js"></script>
  <script src="abas.js"></script>
  <script src="home.js"></script>
</body>
</html>
