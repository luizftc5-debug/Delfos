<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Investimentos · Delfos</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <div class="app">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main">
      <div class="wrap">
        <a class="voltar" href="financeiro.html">← Financeiro</a>

        <header class="topbar">
          <div>
            <h1>Investimentos</h1>
            <p class="sub">Renda fixa, ações, fundos e cripto — o que você já aplicou e quanto vale hoje.</p>
          </div>
          <div class="topbar-actions">
            <button class="btn primary" id="btn-investimento">+ Investimento</button>
          </div>
        </header>

        <div class="grid g4" style="margin-bottom:14px;">
          <div class="card tinted financeiro">
            <div class="stat-label">Total aplicado</div>
            <div class="stat-value num" id="s-aplicado">—</div>
            <div class="stat-sub" id="s-aplicado-d"></div>
          </div>
          <div class="card tinted financeiro">
            <div class="stat-label">Valor atual</div>
            <div class="stat-value num" id="s-atual">—</div>
            <div class="stat-sub" id="s-atual-d"></div>
          </div>
          <div class="card tinted financeiro">
            <div class="stat-label">Rentabilidade</div>
            <div class="stat-value num" id="s-ganho">—</div>
            <div class="stat-sub" id="s-ganho-d"></div>
          </div>
          <div class="card tinted financeiro">
            <div class="stat-label">Diversificação</div>
            <div class="stat-value num" id="s-tipos">—</div>
            <div class="stat-sub" id="s-tipos-d"></div>
          </div>
        </div>

        <section class="section" style="margin-top:8px;">
          <div class="section-head">
            <h2 class="section-title"><span class="swatch financeiro"></span>Por tipo</h2>
          </div>
          <div class="card"><div id="por-tipo"></div></div>
        </section>

        <section class="section">
          <div class="section-head">
            <h2 class="section-title">Seus investimentos</h2>
            <span class="card-note" id="resumo"></span>
          </div>
          <div id="lista"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="arquivos.js"></script>
  <script src="store.js"></script>
  <script src="ui.js"></script>
  <script src="financas.js"></script>
  <script src="investimentos.js"></script>
</body>
</html>
