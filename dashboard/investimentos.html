<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Investimentos · Delfos</title>
  <meta name="theme-color" content="#111110" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Sans:ital,wght@0,300..800;1,300..800&family=Gloock&display=swap" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <div class="app">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main">
      <div class="wrap">
        <header class="topbar">
          <div>
            <h1>Investimentos</h1>
            <p class="sub">Renda fixa, ações, fundos e cripto: o que você já aplicou e quanto vale hoje.</p>
          </div>
          <div class="topbar-actions">
            <button class="btn primary" id="btn-investimento">+ Investimento</button>
          </div>
        </header>

        <nav class="abas" aria-label="Seções do financeiro">
          <a href="financeiro.html">Resumo do mês</a>
          <a href="contas.html">Contas e cartões</a>
          <a href="investimentos.html" aria-current="page">Investimentos</a>
        </nav>

        <div class="grid g4" style="margin-bottom:14px;">
          <div class="card tinted financeiro">
            <div class="stat-label">Total aplicado</div>
            <div class="stat-value num" id="s-aplicado">-</div>
            <div class="stat-sub" id="s-aplicado-d"></div>
          </div>
          <div class="card tinted financeiro">
            <div class="stat-label">Valor atual</div>
            <div class="stat-value num" id="s-atual">-</div>
            <div class="stat-sub" id="s-atual-d"></div>
          </div>
          <div class="card tinted financeiro">
            <div class="stat-label">Rentabilidade</div>
            <div class="stat-value num" id="s-ganho">-</div>
            <div class="stat-sub" id="s-ganho-d"></div>
          </div>
          <div class="card tinted financeiro">
            <div class="stat-label">Diversificação</div>
            <div class="stat-value num" id="s-tipos">-</div>
            <div class="stat-sub" id="s-tipos-d"></div>
          </div>
        </div>

        <div class="gaveteiro">
          <section class="gaveta" data-gaveta="lista">
            <header class="gaveta-cab">
              <h2 class="gaveta-titulo">Seus investimentos</h2>
              <span class="gaveta-resumo" id="resumo"></span>
            </header>
            <div class="gaveta-corpo"><div id="lista"></div></div>
          </section>

          <section class="gaveta" data-gaveta="por-tipo">
            <header class="gaveta-cab">
              <h2 class="gaveta-titulo">Por tipo</h2>
              <span class="gaveta-resumo" id="por-tipo-resumo"></span>
            </header>
            <div class="gaveta-corpo"><div id="por-tipo"></div></div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="arquivos.js"></script>
  <script src="store.js"></script>
  <script src="personalizacao.js"></script>
  <script src="ui.js"></script>
  <script src="sessao.js"></script>
  <script src="nuvem.js"></script>
  <script src="financas.js"></script>
  <script src="leituras.js"></script>
  <script src="investimentos.js"></script>
</body>
</html>
