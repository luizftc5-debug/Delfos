<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pessoal · Delfos</title>
  <meta name="theme-color" content="#111110" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Sans:ital,wght@0,300..800;1,300..800&family=Noto+Serif+Display:wght@300..600&display=swap" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <div class="app">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main">
      <div class="wrap">
        <header class="topbar">
          <div>
            <h1>Pessoal</h1>
            <p class="sub">Consultas, tarefas e recados que não são nem financeiro, nem faculdade, nem projeto.</p>
          </div>
          <div class="topbar-actions">
            <button class="btn" id="btn-importar-cal">Importar calendário</button>
            <button class="btn primary" id="btn-compromisso">+ Compromisso</button>
          </div>
        </header>

        <p class="leitura" id="leitura"></p>

        <div class="grid g3" style="margin-bottom:14px;">
          <div class="card tinted pessoal">
            <div class="stat-label">Em aberto</div>
            <div class="stat-value num" id="s-abertos">-</div>
            <div class="stat-sub" id="s-abertos-d"></div>
          </div>
          <div class="card tinted pessoal">
            <div class="stat-label">Nesta semana</div>
            <div class="stat-value num" id="s-semana">-</div>
            <div class="stat-sub" id="s-semana-d"></div>
          </div>
          <div class="card tinted pessoal">
            <div class="stat-label">Atrasados</div>
            <div class="stat-value num" id="s-atrasados">-</div>
            <div class="stat-sub" id="s-atrasados-d"></div>
          </div>
        </div>

        <nav class="abas" role="tablist" aria-label="Como ver os compromissos">
          <button type="button" role="tab" data-vista="calendario">Calendário</button>
          <button type="button" role="tab" data-vista="lista">Lista</button>
        </nav>

        <section class="card calendario" id="calendario" data-na-vista="calendario"></section>

        <div class="gaveteiro">
          <section class="gaveta" data-gaveta="proximos" data-icone="relogio" data-na-vista="calendario">
            <header class="gaveta-cab">
              <h2 class="gaveta-titulo">O que se aproxima</h2>
              <span class="gaveta-resumo" id="proximos-resumo">próximas duas semanas, de todas as abas</span>
            </header>
            <div class="gaveta-corpo">
              <div id="proximos"></div>
              <div class="lembrete-rodape" id="lembrete-config"></div>
            </div>
          </section>

          <section class="gaveta" data-gaveta="lista" data-icone="lista" data-na-vista="lista">
            <header class="gaveta-cab">
              <h2 class="gaveta-titulo">Compromissos</h2>
              <span class="gaveta-resumo" id="lista-resumo"></span>
              <div class="gaveta-acoes">
                <label class="card-note" style="display:flex; align-items:center; gap:6px; cursor:pointer;"><input type="checkbox" class="check" id="f-concluidos" /> ver concluídos</label>
              </div>
            </header>
            <div class="gaveta-corpo">
              <div class="chips" id="f-tipo" style="margin-bottom:18px;"></div>
              <div id="lista"></div>
            </div>
          </section>

          <section class="gaveta" data-gaveta="notas" data-icone="lampada">
            <header class="gaveta-cab">
              <h2 class="gaveta-titulo">O que o Delfos notou</h2>
              <span class="gaveta-resumo" data-resumo-notas></span>
            </header>
            <div class="gaveta-corpo"><ul class="notas" id="notas"></ul></div>
          </section>

          <section class="gaveta" id="sec-perguntas" data-gaveta="perguntas" data-icone="pergunta" data-fechada hidden>
            <header class="gaveta-cab">
              <h2 class="gaveta-titulo">Perguntas do Delfos</h2>
              <span class="gaveta-resumo"></span>
            </header>
            <div class="gaveta-corpo"><div class="perguntas" id="perguntas"></div></div>
          </section>

          <section class="gaveta" data-gaveta="por-tipo" data-icone="grade" data-fechada>
            <header class="gaveta-cab">
              <h2 class="gaveta-titulo">Por tipo</h2>
              <span class="gaveta-resumo" id="por-tipo-resumo"></span>
            </header>
            <div class="gaveta-corpo"><div id="por-tipo"></div></div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="arquivos.js"></script>
  <script src="store.js"></script>
  <script src="personalizacao.js"></script>
  <script src="ui.js"></script>
  <script src="sessao.js"></script>
  <script src="nuvem.js"></script>
  <script src="financas.js"></script>
  <script src="leituras.js"></script>
  <script src="config.js"></script>
  <script src="google-integration.js"></script>
  <script src="calendario.js"></script>
  <script src="pessoal.js"></script>
</body>
</html>
