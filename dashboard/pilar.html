<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aba · Delfos</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Sans:ital,wght@0,300..800;1,300..800&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&display=swap" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <div class="app">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main">
      <div class="wrap" id="conteudo">
        <header class="topbar">
          <div>
            <div class="eyebrow" id="etiqueta">Sua aba</div>
            <h1 id="titulo">—</h1>
            <p class="sub" id="subtitulo"></p>
          </div>
          <div class="topbar-actions">
            <button class="btn ghost" id="btn-editar-aba" type="button"></button>
            <button class="btn primary" id="btn-item" type="button"></button>
          </div>
        </header>

        <p class="leitura" id="leitura"></p>

        <div class="grid g4" id="bloco-stats" style="margin-bottom:14px;"></div>

        <section class="section hidden" id="secao-academia">
          <div class="section-head">
            <h2 class="section-title"><span class="swatch" id="swatch-academia"></span>Dias de treino</h2>
            <button class="btn ghost sm" id="btn-dia">+ Dia de treino</button>
          </div>
          <div id="academia-conteudo"></div>
        </section>

        <div class="fin-duas section" id="secao-itens" style="margin-top:28px;">
          <section class="card">
            <div class="card-head">
              <h2 class="card-title" id="titulo-lista"><span class="swatch" id="swatch-lista"></span>Itens</h2>
              <div class="seg sm vistas" id="f-vista" role="group" aria-label="Como ver"></div>
            </div>
            <div class="fin-filtros" style="margin-bottom:16px;">
              <div class="chips" id="f-grupo"></div>
              <label class="busca"><span class="hidden">Buscar</span><input class="input" type="search" id="f-busca" placeholder="Buscar" /></label>
              <select class="input" id="f-ordem" aria-label="Ordenar"></select>
              <label class="card-note" style="display:flex; align-items:center; gap:6px; cursor:pointer;"><input type="checkbox" class="check" id="f-concluidos" /> ver concluídos</label>
            </div>
            <div id="lista"></div>
          </section>
          <div class="fin-coluna" id="coluna-lado">
            <section class="card">
              <div class="card-head"><h2 class="card-title">O que o Delfos notou</h2></div>
              <ul class="notas" id="notas"></ul>
            </section>
            <div id="resumos-campos" class="fin-coluna"></div>
          </div>
        </div>

        <section class="section" id="sec-perguntas" hidden>
          <div class="section-head">
            <h2 class="section-title">Perguntas do Delfos</h2>
          </div>
          <div class="perguntas" id="perguntas"></div>
        </section>

        <section class="section">
          <div class="section-head">
            <h2 class="section-title">Ajustes da aba</h2>
          </div>
          <div class="card">
            <p class="card-note" id="nota-ajustes" style="margin:0 0 12px;"></p>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button class="btn" id="btn-editar-aba-2">Personalizar aba</button>
              <button class="btn" id="btn-campos">Campos desta aba</button>
              <button class="btn" id="btn-layout">Layout e exibição</button>
              <button class="btn" id="btn-refazer-questionario" hidden>Refazer o questionário inicial</button>
              <button class="btn danger" id="btn-excluir-aba">Excluir esta aba</button>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="exercicios.js"></script>
  <script src="arquivos.js"></script>
  <script src="store.js"></script>
  <script src="personalizacao.js"></script>
  <script src="ui.js"></script>
  <script src="sessao.js"></script>
  <script src="nuvem.js"></script>
  <script src="financas.js"></script>
  <script src="leituras.js"></script>
  <script src="abas.js"></script>
  <script src="calendario.js"></script>
  <script src="pilar.js"></script>
</body>
</html>
