<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Aba · Delfos</title>
  <meta name="theme-color" content="#111110" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Sans:ital,wght@0,300..800;1,300..800&family=Noto+Serif+Display:wght@300..600&display=swap" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <div class="app">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main">
      <div class="wrap" id="conteudo">
        <header class="topbar">
          <div>
            <div class="eyebrow" id="etiqueta">Sua aba</div>
            <h1 id="titulo">&nbsp;</h1>
            <p class="sub" id="subtitulo"></p>
          </div>
          <div class="topbar-actions">
            <button class="btn ghost" id="btn-editar-aba" type="button"></button>
            <button class="btn primary" id="btn-item" type="button"></button>
          </div>
        </header>

        <p class="leitura" id="leitura"></p>

        <div class="grid g4" id="bloco-stats" style="margin-bottom:14px;"></div>

        <section class="gaveta hidden" id="secao-academia" data-gaveta="academia" data-icone="haltere">
          <header class="gaveta-cab">
            <h2 class="gaveta-titulo"><span class="swatch" id="swatch-academia"></span>Dias de treino</h2>
            <span class="gaveta-resumo" id="academia-resumo"></span>
            <div class="gaveta-acoes"><button class="btn sm" id="btn-dia" type="button">+ Dia de treino</button></div>
          </header>
          <div class="gaveta-corpo"><div id="academia-conteudo"></div></div>
        </section>

        <div class="gaveteiro" id="secao-itens">
          <section class="gaveta" data-gaveta="itens" data-icone="lista">
            <header class="gaveta-cab">
              <h2 class="gaveta-titulo" id="titulo-lista"><span class="swatch" id="swatch-lista"></span>Itens</h2>
              <span class="gaveta-resumo" id="lista-resumo"></span>
              <div class="gaveta-acoes"><div class="seg sm vistas" id="f-vista" role="group" aria-label="Como ver"></div></div>
            </header>
            <div class="gaveta-corpo">
              <div class="fin-filtros" style="margin-bottom:16px;">
                <div class="chips" id="f-grupo"></div>
                <label class="busca"><input class="input" type="search" id="f-busca" placeholder="Buscar…" aria-label="Buscar nesta aba" autocomplete="off" /></label>
                <select class="input" id="f-ordem" aria-label="Ordenar"></select>
                <label class="card-note" style="display:flex; align-items:center; gap:6px; cursor:pointer;"><input type="checkbox" class="check" id="f-concluidos" /> ver concluídos</label>
              </div>
              <div id="lista"></div>
            </div>
          </section>

          <div class="gaveteiro" id="coluna-lado">
            <section class="gaveta" data-gaveta="notas" data-icone="lampada">
              <header class="gaveta-cab">
                <h2 class="gaveta-titulo">O que o Delfos notou</h2>
                <span class="gaveta-resumo" data-resumo-notas></span>
              </header>
              <div class="gaveta-corpo"><ul class="notas" id="notas"></ul></div>
            </section>
            <section class="gaveta" data-gaveta="campos" data-icone="grade" hidden>
              <header class="gaveta-cab">
                <h2 class="gaveta-titulo">Em números</h2>
                <span class="gaveta-resumo" id="campos-resumo"></span>
              </header>
              <div class="gaveta-corpo"><div id="resumos-campos" class="compartimentos"></div></div>
            </section>
          </div>
        </div>

        <div class="gaveteiro">
          <section class="gaveta" id="sec-perguntas" data-gaveta="perguntas" data-icone="pergunta" data-fechada hidden>
            <header class="gaveta-cab">
              <h2 class="gaveta-titulo">Perguntas do Delfos</h2>
              <span class="gaveta-resumo"></span>
            </header>
            <div class="gaveta-corpo"><div class="perguntas" id="perguntas"></div></div>
          </section>

          <section class="gaveta" data-gaveta="ajustes" data-icone="ajustes" data-fechada>
            <header class="gaveta-cab">
              <h2 class="gaveta-titulo">Ajustes da aba</h2>
              <span class="gaveta-resumo">personalizar, campos, layout ou excluir</span>
            </header>
            <div class="gaveta-corpo">
              <p class="proposito-aba" id="proposito-aba" hidden><b>Propósito</b><span></span></p>
              <p class="card-note" id="nota-ajustes" style="margin:0 0 12px;"></p>
              <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <button class="btn" id="btn-editar-aba-2">Personalizar aba</button>
                <button class="btn" id="btn-campos">Campos desta aba</button>
                <button class="btn" id="btn-layout">Layout e exibição</button>
                <button class="btn" id="btn-refazer-questionario" hidden>Refazer o questionário inicial</button>
                <button class="btn danger" id="btn-excluir-aba">Excluir esta aba</button>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="exercicios.js"></script>
  <script src="arquivos.js"></script>
  <script src="store.js"></script>
  <script src="personalizacao.js"></script>
  <script src="ui.js"></script>
  <script src="sessao.js"></script>
  <script src="nuvem.js"></script>
  <script src="financas.js"></script>
  <script src="leituras.js"></script>
  <script src="calendario.js"></script>
  <script src="pilar.js"></script>
</body>
</html>
