<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Projeto · Delfos</title>
  <meta name="theme-color" content="#111110" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Sans:ital,wght@0,300..800;1,300..800&family=Noto+Serif+Display:wght@300..600&display=swap" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <div class="app">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main">
      <div class="wrap" id="conteudo">
        <a class="voltar" href="projetos.html">← Projetos</a>

        <header class="topbar">
          <div>
            <div class="eyebrow projetos" id="etiqueta">Projeto</div>
            <h1 id="titulo">&nbsp;</h1>
            <p class="sub" id="subtitulo"></p>
            <div class="selos" id="selos"></div>
          </div>
          <div class="topbar-actions">
            <button class="btn" id="btn-editar">Editar projeto</button>
            <button class="btn primary" id="btn-recebimento">+ Recebimento</button>
          </div>
        </header>

        <div class="grid g4" id="stats" style="margin-bottom:14px;"></div>

        <div class="gaveteiro">
          <section class="gaveta" data-gaveta="etapas" data-icone="lista">
            <header class="gaveta-cab">
              <h2 class="gaveta-titulo">Etapas</h2>
              <span class="gaveta-resumo" id="etapas-resumo"></span>
              <div class="gaveta-acoes"><button class="btn sm" id="btn-etapa" type="button">+ Etapa</button></div>
            </header>
            <div class="gaveta-corpo">
              <div id="progresso"></div>
              <div id="etapas"></div>
            </div>
          </section>

          <section class="gaveta" data-gaveta="recebimentos" data-icone="cofre">
            <header class="gaveta-cab">
              <h2 class="gaveta-titulo">Recebimentos</h2>
              <span class="gaveta-resumo" id="recebimentos-resumo"></span>
            </header>
            <div class="gaveta-corpo"><div id="recebimentos"></div></div>
          </section>

          <section class="gaveta" data-gaveta="custos" data-icone="carrinho">
            <header class="gaveta-cab">
              <h2 class="gaveta-titulo">Custos do projeto</h2>
              <span class="gaveta-resumo" id="custos-resumo"></span>
              <div class="gaveta-acoes"><button class="btn sm" id="btn-custo" type="button">+ Custo</button></div>
            </header>
            <div class="gaveta-corpo"><div id="custos"></div></div>
          </section>

          <section class="gaveta" data-gaveta="ficha" data-icone="info" data-fechada>
            <header class="gaveta-cab">
              <h2 class="gaveta-titulo">Ficha do projeto</h2>
              <span class="gaveta-resumo" id="ficha-resumo">tipo, cliente, datas, prioridade e horas</span>
            </header>
            <div class="gaveta-corpo"><div id="ficha"></div></div>
          </section>

          <section class="gaveta" data-gaveta="anotacoes" data-icone="lapis">
            <header class="gaveta-cab">
              <h2 class="gaveta-titulo">Anotações</h2>
              <span class="gaveta-resumo" id="anotacoes-resumo"></span>
              <div class="gaveta-acoes"><button class="btn sm" id="btn-anotacoes" type="button">Editar anotações</button></div>
            </header>
            <div class="gaveta-corpo"><div id="anotacoes"></div></div>
          </section>

          <section class="gaveta" data-gaveta="anexos" data-icone="anexar" data-fechada>
            <header class="gaveta-cab">
              <h2 class="gaveta-titulo">Documentos</h2>
              <span class="gaveta-resumo" id="anexos-resumo"></span>
              <div class="gaveta-acoes"><button class="btn sm" id="btn-anexos" type="button">Anexar documentos</button></div>
            </header>
            <div class="gaveta-corpo"><div id="anexos"></div></div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="arquivos.js"></script>
  <script src="store.js"></script>
  <script src="personalizacao.js"></script>
  <script src="ui.js"></script>
  <script src="sessao.js"></script>
  <script src="nuvem.js"></script>
  <script src="financas.js"></script>
  <script src="leituras.js"></script>
  <script src="projeto.js"></script>
</body>
</html>
