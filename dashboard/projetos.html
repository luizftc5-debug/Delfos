<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projetos · Delfos</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <div class="app">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main">
      <div class="wrap">
        <header class="topbar">
          <div>
            <div class="eyebrow projetos">Renda e iniciativas</div>
            <h1>Projetos</h1>
            <p class="sub">Iniciativas pessoais que geram renda. Trabalhos da faculdade e o TCC ficam em <a href="faculdade.html">Faculdade</a>.</p>
          </div>
          <div class="topbar-actions">
            <button class="btn" id="btn-oportunidade">+ Oportunidade</button>
            <button class="btn primary" id="btn-projeto">+ Projeto</button>
          </div>
        </header>

        <div class="grid g4" style="margin-bottom:14px;">
          <div class="card tinted projetos">
            <div class="stat-label">Projetos ativos</div>
            <div class="stat-value num" id="s-ativos">—</div>
            <div class="stat-sub" id="s-ativos-d"></div>
          </div>
          <div class="card tinted projetos">
            <div class="stat-label">Renda potencial</div>
            <div class="stat-value num" id="s-renda">—</div>
            <div class="stat-sub" id="s-renda-d"></div>
          </div>
          <div class="card tinted projetos">
            <div class="stat-label">Já faturado</div>
            <div class="stat-value num" id="s-faturado">—</div>
            <div class="stat-sub" id="s-faturado-d"></div>
          </div>
          <div class="card tinted projetos">
            <div class="stat-label">Etapas concluídas</div>
            <div class="stat-value num" id="s-etapas">—</div>
            <div class="stat-sub" id="s-etapas-d"></div>
          </div>
        </div>

        <div id="projetos"></div>

        <section class="section">
          <div class="section-head">
            <h2 class="section-title">Oportunidades de renda</h2>
            <span class="card-note">ideias ainda não viraram projeto</span>
          </div>
          <div class="card"><div id="oportunidades"></div></div>
        </section>
      </div>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="arquivos.js"></script>
  <script src="store.js"></script>
  <script src="ui.js"></script>
  <script src="financas.js"></script>
  <script src="projetos.js"></script>
</body>
</html>
